[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchmode-truth-lab"
version = "0.1.0"
description = "Black-box freshness checks for watch-mode tools"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
watchmode-truth-lab = "watchmode_truth_lab.cli:main"

[tool.setuptools.packages.find]
include = ["watchmode_truth_lab*"]

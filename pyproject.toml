[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "watchmode-truth-lab"
dynamic = ["version"]
description = "Black-box freshness checks for watch-mode tools"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
watchmode-truth-lab = "watchmode_truth_lab.cli:main"

[tool.setuptools.packages.find]
include = ["watchmode_truth_lab*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "watchmode_truth_lab.__version__"}

[tool.setuptools.package-data]
watchmode_truth_lab = ["assets/common/*", "assets/file/*", "assets/vite/*", "assets/vite/fixture/*", "assets/vite/fixture/src/*"]
